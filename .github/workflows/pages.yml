# Builds the site and publishes the preview on GitHub Pages:
# https://alex-sashev.github.io/GinArt/  (hidden from search engines)
name: Publish preview (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh SuperDoc ratings"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          BASE_PATH: /GinArt
          PREVIEW: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
