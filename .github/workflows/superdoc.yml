# Every Monday: refresh SuperDoc ratings and commit if they changed.
# The commit triggers a Cloudflare Pages rebuild.
name: Refresh SuperDoc ratings
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'alex-sashev/ginart-public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_superdoc.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Refresh SuperDoc ratings"
            git push
          fi
